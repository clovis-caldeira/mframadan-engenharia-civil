<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" role="img" aria-label="MFRAMADAN Engenharia Civil">
  <defs>
    <linearGradient id="mfBuilding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Letra M -->
  <text x="140" y="158" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Impact,Arial,sans-serif"
        font-weight="900" font-size="200" letter-spacing="-12" fill="#0b2545">M</text>
  <!-- Silhueta de prédios (encaixa no vão central da M) -->
  <g fill="url(#mfBuilding)">
    <rect x="108" y="80" width="18" height="80" rx="1"/>
    <rect x="128" y="55" width="24" height="105" rx="1"/>
    <rect x="154" y="85" width="18" height="75" rx="1"/>
  </g>
  <!-- Janelas (faixas claras) -->
  <g fill="#dbeafe" opacity=".55">
    <rect x="112" y="92"  width="10" height="3"/>
    <rect x="112" y="105" width="10" height="3"/>
    <rect x="112" y="118" width="10" height="3"/>
    <rect x="112" y="131" width="10" height="3"/>
    <rect x="112" y="144" width="10" height="3"/>
    <rect x="132" y="68"  width="16" height="3"/>
    <rect x="132" y="81"  width="16" height="3"/>
    <rect x="132" y="94"  width="16" height="3"/>
    <rect x="132" y="107" width="16" height="3"/>
    <rect x="132" y="120" width="16" height="3"/>
    <rect x="132" y="133" width="16" height="3"/>
    <rect x="132" y="146" width="16" height="3"/>
    <rect x="158" y="95"  width="10" height="3"/>
    <rect x="158" y="108" width="10" height="3"/>
    <rect x="158" y="121" width="10" height="3"/>
    <rect x="158" y="134" width="10" height="3"/>
    <rect x="158" y="147" width="10" height="3"/>
  </g>
  <!-- Wordmark -->
  <text x="140" y="205" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Impact,Arial,sans-serif"
        font-weight="900" font-size="34" letter-spacing="4" fill="#0b2545">MFRAMADAN</text>
</svg>
